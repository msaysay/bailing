<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --paper:#faf7f1; --ink:#2a2723; --ink-dim:#8c857a;
      --zhu:#c8402a; --hairline:rgba(42,39,35,.08);
      --badge-bg:#2a2723; --badge-line:#f0ebe2;
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper:#201d1a; --ink:#f0ebe2; --ink-dim:#8f887b;
        --zhu:#e05a44; --hairline:rgba(240,235,226,.10);
        --badge-bg:#f0ebe2; --badge-line:#201d1a; }
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
    html,body { background:transparent; overflow:hidden; height:100%;
      font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }

    /* 苹果 HUD 圆角卡片：圆角与投影交给 Win11 DWM，无需描边 */
    .pill { width:100%; height:100%; background:var(--paper); color:var(--ink);
      display:flex; align-items:center; gap:9px; padding:0 12px 0 10px; -webkit-app-region:drag; }

    /* 白描线条鸟圆徽（内联 SVG，矢量级清晰） */
    .badge { width:36px; height:36px; flex:none; }
    .badge .b-bg { fill:var(--badge-bg); }
    .badge .b-line { fill:none; stroke:var(--badge-line); stroke-width:2.2;
      stroke-linecap:round; stroke-linejoin:round; }
    .badge .b-eye { fill:var(--zhu); }

    .mid { flex:1; min-width:0; display:flex; align-items:center; height:100%; }

    /* 波形（墨色圆头短柱，9 根） */
    .wave { display:none; align-items:center; gap:2.5px; height:24px; }
    .wave i { width:3px; height:5px; border-radius:3px;
      background:var(--ink); opacity:.85; transition:height .09s ease; }

    .txt { display:none; font-size:13.5px; font-weight:500; letter-spacing:.2px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .right { display:flex; align-items:center; gap:8px; flex:none; }
    .timer { font-size:12.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums; display:none; }
    .recdot { width:8px; height:8px; border-radius:50%; background:var(--zhu);
      display:none; animation:blink 1.1s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .warn { display:none; width:18px; height:18px; border-radius:50%; background:var(--zhu); color:#faf7f1;
      font-size:13px; font-weight:700; align-items:center; justify-content:center; }
    /* 朱砂方章「改错」 */
    .fix { display:none; font-size:12px; font-weight:600; letter-spacing:2px; text-indent:2px;
      color:#faf7f1; background:var(--zhu); cursor:pointer; padding:4px 8px; border-radius:4px;
      -webkit-app-region:no-drag; transition:filter .15s ease; }
    .fix:hover { filter:brightness(.92); }

    /* 状态切换 */
    .pill.rec  .wave  { display:flex; }
    .pill.rec  .timer { display:inline; }
    .pill.rec  .recdot{ display:block; }
    .pill.proc .txt, .pill.done .txt, .pill.err .txt { display:block; }
    .pill.done .fix { display:inline-flex; align-items:center; }
    .pill.err  .warn { display:flex; }
    .pill.err  .txt  { color:var(--zhu); }
    /* 处理中文字流光 */
    .pill.proc .txt {
      background:linear-gradient(90deg,var(--ink-dim) 30%,var(--ink) 50%,var(--ink-dim) 70%);
      background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
      animation:shimmer 1.3s linear infinite; }
    @keyframes shimmer { to { background-position:-200% 0; } }
    @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .txt.reveal { animation:fadeUp .32s cubic-bezier(.2,.7,.3,1); }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <svg class="badge" viewBox="0 0 48 48" aria-hidden="true">
      <circle class="b-bg" cx="24" cy="24" r="24" />
      <!-- 白描鸟：闭合圆身（背→冠→喙→喉→腹）+ 外卷尾，与 scripts/gen-icons.js 同源 -->
      <path class="b-line" d="M36 28 Q38 16 27 12 Q18.5 8.8 13.8 15.5 L8.8 18.6 L13.6 20.6 Q13 30 21.5 33.5 Q29 36 36 28" />
      <path class="b-line" d="M36 28 Q42 27 41.5 22 Q41 18.5 38 20.5" />
      <circle class="b-eye" cx="18" cy="16.5" r="1.7" />
    </svg>
    <div class="mid">
      <div class="wave" id="wave"></div>
      <div class="txt" id="txt">正在记录你的想法</div>
    </div>
    <div class="right">
      <span class="timer" id="timer">0:00</span>
      <span class="recdot"></span>
      <span class="warn">!</span>
      <span class="fix" id="fix">改错</span>
    </div>
  </div>
  <script src="indicator.js"></script>
</body>
</html>
