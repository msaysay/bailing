<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>快速修正</title>
  <style>
    :root { --brand:#c8402a; --hero:#2a2723; --bg:#f5f2ec; --card:#fdfbf7; --text:#2a2723;
      --sub:#8c857a; --line:#e9e3d8; --field:#f8f5ef; --ok:#1e9e6a; }
    @media (prefers-color-scheme: dark){ :root{ --brand:#e05a44; --hero:#2e2a25; --bg:#161311; --card:#201d1a; --text:#f0ebe2; --sub:#8f887b;
      --line:#33302a; --field:#1b1815; } }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background:var(--bg); color:var(--text); font-size:14px; }
    .hero{ position:relative; padding:16px 20px; background:var(--hero); color:#f0ebe2; -webkit-app-region:drag; }
    .hero h1{ font-size:16px; font-weight:700; }
    .hero p{ font-size:12px; opacity:.92; margin-top:4px; }
    /* 自绘窗口按钮：融进墨底 hero 的幽灵钮 */
    .winctrl{ position:absolute; top:0; right:0; display:flex; -webkit-app-region:no-drag; }
    .winctrl button{ width:42px; height:34px; border:none; background:transparent; cursor:pointer;
      display:flex; align-items:center; justify-content:center; color:rgba(240,235,226,.6);
      transition:background .15s, color .15s; }
    .winctrl button:hover{ background:rgba(240,235,226,.12); color:#f0ebe2; }
    .winctrl button.close:hover{ background:var(--brand); color:#faf7f1; }
    .wrap{ padding:14px 18px; }
    .last{ background:var(--field); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
      font-size:13px; color:var(--sub); line-height:1.5; max-height:80px; overflow:auto; margin-bottom:14px; }
    .last b{ color:var(--text); }
    .row{ display:flex; align-items:center; gap:8px; }
    .fld{ flex:1; }
    .fld label{ font-size:11.5px; color:var(--sub); display:block; margin-bottom:4px; }
    input[type=text]{ width:100%; font-size:14px; padding:9px 11px; border:1px solid var(--line);
      border-radius:9px; background:var(--field); color:var(--text); outline:none; }
    input:focus{ border-color:var(--brand); }
    .arrow{ color:var(--sub); font-size:18px; padding-top:16px; }
    .save{ margin-top:12px; font-size:14px; font-weight:600; padding:9px 20px; border:none; border-radius:10px;
      color:#faf7f1; cursor:pointer; background:var(--brand); }
    .msg{ font-size:12.5px; color:var(--ok); margin-left:10px; opacity:0; transition:opacity .2s; }
    .msg.show{ opacity:1; }
    .grp{ font-size:12px; color:var(--sub); font-weight:600; margin:18px 2px 8px; }
    .clist{ display:flex; flex-direction:column; gap:6px; }
    .citem{ display:flex; align-items:center; justify-content:space-between; background:var(--card);
      border:1px solid var(--line); border-radius:9px; padding:8px 11px; font-size:13px; }
    .citem .x{ cursor:pointer; color:var(--sub); }
    .citem .x:hover{ color:#e24b4a; }
    .empty{ font-size:12.5px; color:var(--sub); }
    .hint{ font-size:11.5px; color:var(--sub); line-height:1.6; margin-top:12px; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="winctrl">
      <button id="wcMin" title="最小化"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
      <button id="wcClose" class="close" title="关闭"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    </div>
    <h1>快速修正</h1>
    <p>把刚才听错的词教给它，以后同音再听到就自动写成正字——越用越准。</p>
  </div>
  <div class="wrap">
    <div class="last" id="last">（没有可修正的上一句）</div>
    <div class="row">
      <div class="fld"><label>听成了（错的）</label><input type="text" id="wrong" placeholder="如 太抖 / 季婷" /></div>
      <span class="arrow">→</span>
      <div class="fld"><label>应该是（正字）</label><input type="text" id="right" placeholder="如 泰斗 / 冀婷" /></div>
    </div>
    <button class="save" id="save">记住</button><span class="msg" id="msg">已记住 ✓</span>

    <div class="grp">最近记住的修正</div>
    <div class="clist" id="clist"><span class="empty">还没有。</span></div>

    <div class="hint">🔒 只存本机。这条会同时进你的纠正表和专名词库。</div>
  </div>
  <script src="correction-ui.js"></script>
  <script>
    document.getElementById('wcMin').onclick = () => window.bailingSettings.winControl('minimize');
    document.getElementById('wcClose').onclick = () => window.bailingSettings.winControl('close');
  </script>
</body>
</html>
