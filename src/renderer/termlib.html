<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>专名词库</title>
  <style>
    :root { --brand:#c8402a; --hero:#2a2723; --bg:#f5f2ec; --card:#fdfbf7; --text:#2a2723;
      --sub:#8c857a; --line:#e9e3d8; --field:#f8f5ef; --ok:#1e9e6a; --chip:#f5e6e1; --chiptx:#a03420; }
    @media (prefers-color-scheme: dark){ :root{ --brand:#e05a44; --hero:#2e2a25; --bg:#161311; --card:#201d1a; --text:#f0ebe2; --sub:#8f887b;
      --line:#33302a; --field:#1b1815; --chip:#3a2622; --chiptx:#e08a76; } }
    *{ box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; }
    body{ font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background:var(--bg); color:var(--text); font-size:14px; padding-bottom:70px; }
    .hero{ position:relative; padding:18px 20px; background:var(--hero); color:#f0ebe2; -webkit-app-region:drag; }
    .hero h1{ font-size:17px; font-weight:700; }
    .hero p{ font-size:12px; opacity:.92; margin-top:5px; }
    /* 自绘窗口按钮：融进墨底 hero 的幽灵钮 */
    .winctrl{ position:absolute; top:0; right:0; display:flex; -webkit-app-region:no-drag; }
    .winctrl button{ width:42px; height:34px; border:none; background:transparent; cursor:pointer;
      display:flex; align-items:center; justify-content:center; color:rgba(240,235,226,.6);
      transition:background .15s, color .15s; }
    .winctrl button:hover{ background:rgba(240,235,226,.12); color:#f0ebe2; }
    .winctrl button.close:hover{ background:var(--brand); color:#faf7f1; }
    .wrap{ padding:16px 18px 0; }
    .grp{ font-size:12px; color:var(--sub); font-weight:600; margin:16px 4px 8px; }
    .grp:first-child{ margin-top:4px; }
    .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
    .chips{ display:flex; flex-wrap:wrap; gap:8px; min-height:20px; }
    .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--chip); color:var(--chiptx);
      border-radius:16px; padding:5px 10px; font-size:13px; }
    .chip b{ cursor:pointer; opacity:.6; font-weight:400; }
    .chip b:hover{ opacity:1; }
    .empty{ font-size:12.5px; color:var(--sub); }
    .addrow{ display:flex; gap:8px; margin-top:11px; }
    input[type=text]{ flex:1; font-size:13px; padding:8px 11px; border:1px solid var(--line);
      border-radius:9px; background:var(--field); color:var(--text); outline:none; }
    input:focus{ border-color:var(--brand); }
    .btn{ font-size:13px; padding:8px 14px; border:1px solid var(--line); border-radius:9px;
      background:var(--field); color:var(--text); cursor:pointer; white-space:nowrap; }
    .btn:active{ transform:scale(.97); }
    .btn.primary{ border:none; color:#faf7f1; background:var(--brand); }
    .sugbar{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .sugbar .msg{ font-size:12px; color:var(--sub); }
    .sugs{ display:flex; flex-wrap:wrap; gap:8px; max-height:230px; overflow:auto; }
    .sug{ font-size:13px; padding:5px 11px; border:1px solid var(--line); border-radius:16px;
      background:var(--field); color:var(--text); cursor:pointer; }
    .sug.on{ background:var(--brand); color:#faf7f1; border-color:transparent; }
    .foot{ position:fixed; left:0; right:0; bottom:0; padding:12px 18px; background:var(--card);
      border-top:1px solid var(--line); display:flex; align-items:center; gap:12px; }
    .save{ font-size:14px; font-weight:600; padding:9px 24px; border:none; border-radius:10px; color:#faf7f1;
      cursor:pointer; background:var(--brand); }
    .saved{ font-size:12.5px; color:var(--ok); opacity:0; transition:opacity .2s; }
    .saved.show{ opacity:1; }
    .hint{ font-size:11.5px; color:var(--sub); line-height:1.6; margin:12px 4px 0; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="winctrl">
      <button id="wcMin" title="最小化"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
      <button id="wcClose" class="close" title="关闭"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    </div>
    <h1>专名词库</h1>
    <p>放进这里的正字，会在你说话时把同音听错的自动纠回来（沈庭→沈婷、云衫→云杉）。</p>
  </div>
  <div class="wrap">
    <div class="grp">我的词库</div>
    <div class="card">
      <div class="chips" id="chips"><span class="empty">还没有词。点下面从知识库建议，或手动加。</span></div>
      <div class="addrow">
        <input type="text" id="addInput" placeholder="手动加一个正字，如 沈婷 / 云杉资本 / Obsidian" />
        <button class="btn primary" id="addBtn">添加</button>
      </div>
    </div>

    <div class="grp">从你的知识库建议</div>
    <div class="card">
      <div class="sugbar">
        <button class="btn" id="sugBtn">从知识库挑专名</button>
        <button class="btn" id="addAllBtn" style="display:none">全部加入</button>
        <span class="msg" id="sugMsg">点一下，AI 从你的 Obsidian 里挑出人名/公司/产品/术语</span>
      </div>
      <div class="sugs" id="sugs"></div>
    </div>

    <div class="hint">🔒 词库存在你本机。你每次手动改过的写法，之后也会自动记住——越用越准。</div>
  </div>

  <div class="foot">
    <button class="save" id="save">保存词库</button>
    <span class="saved" id="saved">已保存 ✓</span>
  </div>
  <script src="termlib-ui.js"></script>
  <script>
    document.getElementById('wcMin').onclick = () => window.bailingSettings.winControl('minimize');
    document.getElementById('wcClose').onclick = () => window.bailingSettings.winControl('close');
  </script>
</body>
</html>
