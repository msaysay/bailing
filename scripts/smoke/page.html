<h1>门店经营月报 · 示例数据</h1><div class="meta">2026 年 10 月 · 全部为虚构示例，用于渲染验证</div>
<p>本月到店客流同比增长 12%，但客单价下降了 9%，整体营收基本持平。</p>
<p>拆开看，新客占比从 31% 提高到 44%，新客首单金额只有老客的六成。</p>
<p id="t"><span id="target">复购率连续三个月下滑，从 38% 降到 29%</span>，这是利润变薄的主要原因。</p>
<table><tr><th>指标</th><th>8 月</th><th>9 月</th><th>10 月</th></tr>
<tr><td>复购率</td><td>38%</td><td>33%</td><td>29%</td></tr><tr><td>客单价（元）</td><td>86</td><td>82</td><td>78</td></tr><tr><td>新客占比</td><td>31%</td><td>37%</td><td>44%</td></tr></table>
<p>结论：增长来自拉新，留不住人；下个月的预算应先投向会员复购。</p></main>
