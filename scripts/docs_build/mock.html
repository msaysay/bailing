</style></head><body><div id="root"></div><script>
const P = new URLSearchParams(location.search).get('p');
const win = (title, body, tag = '示意图 · 以 Codex / WorkBuddy 这类 AI 助手为例') => `<div class="win"><div class="bar"><i></i><i></i><i></i><b>${title}</b><span class="tag">${tag}</span></div>${body}</div>`;
const A = (h) => `<div class="a"><div class="who">AI 助手</div>${h}</div>`, U = (t) => `<div class="u">${t}</div>`, R = (t) => `<div class="run">${t}</div>`;
const pages = {
  folder: win('解压后的文件夹', `<div class="files"><div class="side"><b>▸ 这台电脑</b><br>桌面<br>下载<br>文档<br>▾ <b>video-studio</b></div><div class="list">
    <div class="row hl"><div>📄</div><b>AGENTS.md</b><span>给 AI 助手看的入口说明 ← 让它先读这个</span></div><div class="row"><div>📄</div><b>CLAUDE.md</b><span>同上（Claude Code 读这个）</span></div>
    <div class="row"><div>📁</div><b>.claude / skills</b><span>每种风格的操作说明（Skill）</span></div><div class="row"><div>📁</div><b>scripts</b><span>粗剪、降噪、配乐、字体等工具，AI 会自己调用</span></div>
    <div class="row"><div>📁</div><b>studio</b><span>出画面的工程（模板和组件）</span></div><div class="row"><div>📁</div><b>fonts</b><span>字体库目录和样张</span></div><div class="row"><div>📁</div><b>music</b><span>默认配乐库</span></div>
    <div class="row hl"><div>📁</div><b>episodes</b><span>你做的每一期都在这里，成片也在这里找</span></div><div class="row"><div>📁</div><b>docs</b><span>对标拆解和流程说明</span></div></div></div>`, '示意图 · 文件夹里有什么'),
  setup: win('第一次用：让 AI 助手装环境', `<div class="chat">${U('读 AGENTS.md，然后帮我把环境装好')}${A(`我先检查这台电脑缺什么。${R('python3 scripts/doctor.py --line talk --fix')}<span class="ok">✓ Node.js 22　✓ ffmpeg　✓ Python 3.12</span><br><span class="ok">✓ 工程依赖　✓ 语音识别模型　✓ 人脸检测模型　✓ 字体</span><br><b>全部就绪。</b>第一次下载了大约 600 MB，以后不用再装。<div class="ask">下一步需要你给我：一条拍好的口播视频（把文件拖进来，或告诉我它在哪）。</div>`)}</div><div class="input">在这里打字，或把视频文件拖进来<span>发送</span></div>`),
  onekey: win('做法一：一键成片', `<div class="chat">${U('读 AGENTS.md，把 桌面/口播原片.mp4 剪成财经解读风的成片。<b>不用问我，一路做到底。</b>')}${A(`好，我按财经解读风来做，中间不停下来问你。${R('<em># 1 转写，找重录和口误</em>\ntalk_prep.py 01_我的第一条 transcribe\n<em># 2 粗剪、对齐字幕</em>\ntalk_prep.py 01_我的第一条 cut --auto-drop\n<em># 3 排版式、配画面、渲染</em>\nremotion render … ep01.mp4\n<em># 4 自查</em>\nqc.py · talk_check.py')}<b>成片做好了：</b>studio/out/ep01.mp4（58 秒）<br>· 自动剪掉了 3 处重录、2 处语气词，列在下面<br>· 有 2 处画面用的是占位图，等你补素材<br>· 嘴型和剪口顺不顺我看不了，请你看一遍`)}</div><div class="input">觉得哪里不对，直接说：「第 20 秒那句别剪」「字体换一个」<span>发送</span></div>`),
  step: win('做法二：一步步确认', `<div class="chat">${U('读 AGENTS.md，把 桌面/口播原片.mp4 剪成财经解读风的成片')}${A(`转写完了。机器找到 3 处重录，我通读后又发现 1 处说反了自己纠正的：<br>① 0:07–0:10「今天我们来聊一个……」（重录，留后一遍）<br>② 0:41「嗯」（语气词）<br>③ 1:12–1:15「不是涨了 3 倍……是 30%」（说反了，留纠正后的）<div class="ask">请你确认：这几处剪掉可以吗？有没有哪句想留前面那一遍？</div>`)}${U('可以，②留着')}${A(`好，②保留。粗剪完成，成片从 1 分 26 秒变成 1 分 18 秒。<br>接下来我排了版式表：前 3 秒人全屏压一张图，第 4 句到第 9 句切素材带，「三种玩法」做成进度牌……<div class="ask">请你看一下版式表和素材清单，可以吗？素材你来出还是我来找？</div>`)}</div><div class="input">每一步它都会停下来问你，一共确认三四次<span>发送</span></div>`),
  options: win('选风格和可选功能', `<div class="chat">${U('我想剪一条口播，有哪些风格？')}${A(`有这几种，你看哪个像你想要的：<br><b>财经解读风</b>：像小 Lin，竖屏，人和素材来回切，胸口压卡片<br><b>横屏深度解读风</b>：像子祺见微，横屏长视频，分章节<br>（社群版还有知识科普、商业快节奏、相框老板、访谈纪实四种）<div class="ask">再问四句：录的地方吵不吵？光线暗不暗？要不要配乐？字体用原配的还是想换？</div>`)}${U('财经解读风。有点吵，要配乐，字体不换')}${A(`记下了：<b>财经解读风</b> + 降噪 + 配乐（默认还开着：去重录、去口吃、收紧停顿、封面）。<br>已经建好这一期，原片放到位了。现在开始粗剪。`)}</div>`),
  flow: `<div class="win"><div class="bar"><i></i><i></i><i></i><b>整个流程一张图</b><span class="tag">黄色 = 你做的　绿色 = AI 做的</span></div><h2>口播流程（你出镜）</h2><div class="flow">
    <div class="st you"><b>① 拍</b><span>一条口播原片<br>说错了整句重说就行</span><i class="me">你</i></div><div class="st"><b>② 粗剪</b><span>去重录、口吃、停顿<br>对字幕</span><i class="ai">AI</i></div><div class="st"><b>③ 修</b><span>降噪、调光<br>（可选）</span><i class="ai">AI</i></div><div class="st"><b>④ 排画面</b><span>版式、素材、卡片<br>字体</span><i class="ai">AI</i></div><div class="st"><b>⑤ 出片</b><span>渲染、自查<br>配乐、封面</span><i class="ai">AI</i></div><div class="st you"><b>⑥ 看</b><span>看成片<br>不满意就说</span><i class="me">你</i></div></div>
    <h2>纯内容生产流程（不出镜，社群版）</h2><div class="flow"><div class="st you"><b>① 给题目</b><span>一句话说讲什么</span><i class="me">你</i></div><div class="st"><b>② 写稿</b><span>查事实、对出处</span><i class="ai">AI</i></div><div class="st"><b>③ 声音</b><span>你念，或 AI 配音</span><i class="ai">AI</i></div><div class="st"><b>④ 找画面</b><span>真实素材<br>登记来源</span><i class="ai">AI</i></div><div class="st"><b>⑤ 做片</b><span>298 个组件<br>图表、大字、转场</span><i class="ai">AI</i></div><div class="st you"><b>⑥ 看</b><span>看成片和封面</span><i class="me">你</i></div></div></div>`,
  terminal: win('看不懂这些黑底绿字？不用懂', `<div class="chat">${A(`${R('python3 scripts/talk_prep.py 01_我的第一条 transcribe')}<b>这一行是「命令」</b>：AI 助手在替你操作电脑。你不用自己打，也不用看懂。<br><br>你只需要看它用<b>白底黑字</b>跟你说的话，尤其是黄色框里的问题。<div class="ask">黄色框 = 它在等你回答。回答完它才会继续。</div>`)}${A(`如果它问你「可以运行这个命令吗？」<br>→ 这是在征求你同意。是它在做这套流程里的事，就点<b>允许</b>。`)}</div>`, '示意图 · 小白看这张'),
};
document.getElementById('root').innerHTML = pages[P] || Object.keys(pages).join(',');
</script></body></html>
